<ion-header>
  <ion-toolbar color="primary">
    <ion-title content-desc="notes-title">
      Mis Notas
    </ion-title>

    <ion-buttons slot="end">
      <ion-button
        content-desc="notes-filter-toggle"
        (click)="filter = (filter === 'all' ? 'favorites' : 'all')">
        <ion-icon
          content-desc="notes-filter-icon"
          [name]="filter === 'all' ? 'star-outline' : 'star'">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Notas Locales -->
  <ion-card>
    <ion-card-header>
      <ion-card-title content-desc="notes-local-title">
        Notas Locales
      </ion-card-title>
    </ion-card-header>

    <ion-list *ngIf="applyFilter.length > 0; else emptyNotes">
      <ion-item
        *ngFor="let note of applyFilter"
        content-desc="notes-item"
        (click)="editNote(note)">

        <ion-label>
          <h2 content-desc="notes-item-title">
            {{ note.title }}
          </h2>
          <p content-desc="notes-item-content">
            {{ note.content }}
          </p>
        </ion-label>

        <ion-button
          content-desc="notes-favorite-toggle"
          fill="clear"
          color="warning"
          (click)="toggleFavorite(note); $event.stopPropagation()">
          <ion-icon [name]="note.favorite ? 'star' : 'star-outline'"></ion-icon>
        </ion-button>

        <ion-button
          content-desc="notes-delete"
          fill="clear"
          color="danger"
          (click)="deleteNote(note.id); $event.stopPropagation()">
          <ion-icon name="trash-outline"></ion-icon>
        </ion-button>

      </ion-item>
    </ion-list>

    <!-- Cuando no hay notas -->
    <ng-template #emptyNotes>
      <ion-text content-desc="notes-empty-message" color="medium">
        <p class="ion-text-center">
          No tienes notas aún 📝
        </p>
      </ion-text>
    </ng-template>
  </ion-card>

  <!-- Notas desde la API -->
  <ion-card
    content-desc="notes-api-card"
    color="light"
    *ngIf="apiNotes.length > 0">

    <ion-card-header>
      <ion-card-title content-desc="notes-api-title">
        Notas desde la API
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list>
        <ion-item
          *ngFor="let apiNote of apiNotes"
          content-desc="notes-api-item">
          <ion-label>
            <h3>{{ apiNote.title }}</h3>
            <p>{{ apiNote.content }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <!-- Botón flotante -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button
      content-desc="notes-add-button"
      (click)="addNote()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- Modal editar / agregar -->
  <ion-modal
    content-desc="notes-edit-modal"
    [isOpen]="editingNote !== null"
    (didDismiss)="cancelEdit()">

    <ng-template>
      <ion-header>
        <ion-toolbar color="light">

          <ion-buttons slot="start">
            <ion-button
              content-desc="notes-edit-cancel"
              (click)="cancelEdit()">
              Cerrar
            </ion-button>
          </ion-buttons>

          <ion-title content-desc="notes-edit-title">
            Editar Nota
          </ion-title>

          <ion-buttons slot="end">
            <ion-button
              content-desc="notes-edit-save"
              color="primary"
              (click)="updateNote()">
              Guardar
            </ion-button>
          </ion-buttons>

        </ion-toolbar>
      </ion-header>

      <ion-content>

        <ion-item lines="none" *ngIf="editingNote">
          <ion-input
            content-desc="notes-edit-title-input"
            [(ngModel)]="editingNote.title"
            placeholder="Título de la nota">
          </ion-input>
        </ion-item>

        <ion-item lines="none" *ngIf="editingNote">
          <ion-textarea
            content-desc="notes-edit-content-input"
            [(ngModel)]="editingNote.content"
            placeholder="Contenido de la nota"
            autoGrow="true">
          </ion-textarea>
        </ion-item>

      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
